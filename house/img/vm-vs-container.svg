<svg width="100%" viewBox="0 0 680 388" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Virtual machine versus container: where the isolation boundary sits</title>
<desc>A virtual machine stacks the citizen app on its own guest OS kernel, separated from the hypervisor and host by a VT-x hardware boundary. A container runs the citizen app fenced only by namespaces on the shared host kernel. Both ultimately run on the same host Linux kernel and hardware.</desc>
<style>
.l{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-weight:500;font-size:14px}
.h{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-weight:600;font-size:16px;fill:#26241f}
.f{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-weight:500;font-size:12.5px;fill:#4a4842}
@media (prefers-color-scheme:dark){.h{fill:#ededea}.f{fill:#c9c7c0}}
</style>
<text class="h" x="40" y="32">Where the wall is: VM vs container</text>
<text class="l" x="185" y="60" text-anchor="middle" fill="#085041">Virtual machine</text>
<text class="l" x="500" y="60" text-anchor="middle" fill="#712B13">Container</text>

<rect x="65" y="72" width="240" height="42" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text class="l" x="185" y="98" text-anchor="middle" fill="#04342C">Citizen — Python</text>
<rect x="65" y="124" width="240" height="42" rx="8" fill="#9FE1CB" stroke="#0F6E56"/>
<text class="l" x="185" y="150" text-anchor="middle" fill="#04342C">Guest OS — its own kernel</text>
<line x1="65" y1="184" x2="305" y2="184" stroke="#0F6E56" stroke-width="3"/>
<text class="f" x="185" y="180" text-anchor="middle">VT-x hardware boundary</text>
<rect x="65" y="192" width="240" height="42" rx="8" fill="#5DCAA5" stroke="#0F6E56"/>
<text class="l" x="185" y="218" text-anchor="middle" fill="#04342C">QEMU — hypervisor process</text>

<text class="f" x="500" y="96" text-anchor="middle" opacity="0.8">no guest OS —</text>
<text class="f" x="500" y="112" text-anchor="middle" opacity="0.8">runs on the host kernel</text>
<rect x="380" y="124" width="240" height="42" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text class="l" x="500" y="150" text-anchor="middle" fill="#4A1B0C">Citizen — Python</text>
<line x1="380" y1="184" x2="620" y2="184" stroke="#993C1D" stroke-width="2" stroke-dasharray="5 4"/>
<text class="f" x="500" y="180" text-anchor="middle">namespaces — software fence</text>

<rect x="65" y="250" width="555" height="42" rx="8" fill="#D3D1C7" stroke="#888780"/>
<text class="l" x="342" y="276" text-anchor="middle" fill="#33312b">Host Linux kernel  +  KVM</text>
<rect x="65" y="302" width="555" height="42" rx="8" fill="#B4B2A9" stroke="#888780"/>
<text class="l" x="342" y="328" text-anchor="middle" fill="#33312b">Hardware — CPU (VT-x) · RAM · disk</text>

<line x1="185" y1="234" x2="185" y2="250" stroke="#888780" stroke-width="1.5"/>
<line x1="500" y1="184" x2="500" y2="250" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4"/>
</svg>
